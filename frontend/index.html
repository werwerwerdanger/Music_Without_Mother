<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleShift - 音乐风格转换</title>
<style>
:root{
  --bg:#0d0d10; --panel:#16161c; --panel2:#1e1e26;
  --border:#2a2a35; --text:#e4e4ea; --dim:#8a8a99;
  --accent:#7c6cf0; --accent2:#a78bfa; --ok:#4ade80; --warn:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  min-height:100vh; padding:32px 24px;
}
.wrap{max-width:960px;margin:0 auto}

header{margin-bottom:28px}
h1{font-size:22px;font-weight:600;letter-spacing:-.3px}
h1 span{color:var(--accent2)}
.sub{color:var(--dim);font-size:13px;margin-top:4px}

.card{
  background:var(--panel); border:1px solid var(--border);
  border-radius:12px; padding:20px; margin-bottom:16px;
}
.card h2{
  font-size:13px; font-weight:600; color:var(--dim);
  text-transform:uppercase; letter-spacing:.6px; margin-bottom:14px;
}

/* 上传区 */
#drop{
  border:2px dashed var(--border); border-radius:10px;
  padding:40px 20px; text-align:center; cursor:pointer;
  transition:.18s; background:var(--panel2);
}
#drop:hover,#drop.over{border-color:var(--accent);background:#1a1a22}
#drop.has-file{border-style:solid;border-color:var(--ok);padding:20px}
#drop .big{font-size:15px;margin-bottom:6px}
#drop .small{font-size:12px;color:var(--dim)}
#fileInfo{display:none;text-align:left;font-size:13px}
#fileInfo .name{font-weight:600;margin-bottom:8px}

/* 波形 */
#waveWrap{position:relative;margin-top:14px;display:none}
#wave{
  width:100%;height:80px;border-radius:6px;
  background:#0a0a0e;display:block;cursor:crosshair;
}
#marks{position:absolute;inset:0;pointer-events:none}
.mk{
  position:absolute;top:0;bottom:0;width:2px;background:var(--warn);
  pointer-events:auto;cursor:pointer;
}
.mk::after{
  content:attr(data-label);position:absolute;top:2px;left:4px;
  font-size:10px;color:var(--warn);white-space:nowrap;
  background:#000a;padding:1px 4px;border-radius:3px;
}
#markList{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;display:none}
.mkItem{
  display:flex;align-items:center;gap:6px;
  background:var(--panel2);border:1px solid var(--border);
  border-radius:6px;padding:4px 8px;font-size:11px;
}
.mkItem select{
  background:transparent;border:none;color:var(--text);font-size:11px;
  outline:none;cursor:pointer;
}
.mkItem .del{cursor:pointer;color:var(--dim);font-size:14px;line-height:1}
.mkItem .del:hover{color:#f87171}
.mkTip{font-size:11px;color:var(--dim);margin-top:6px}

/* 风格网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.style{
  background:var(--panel2); border:1px solid var(--border);
  border-radius:9px; padding:14px 12px; cursor:pointer;
  transition:.15s; position:relative;
}
.style:hover{border-color:#3a3a48;transform:translateY(-1px)}
.style.on{border-color:var(--accent);background:#1c1a2e}
.style .n{font-weight:600;font-size:14px;margin-bottom:3px}
.style .d{font-size:11px;color:var(--dim);line-height:1.4}
.style .tag{
  position:absolute;top:8px;right:8px;font-size:10px;
  padding:1px 6px;border-radius:4px;background:#2a2a35;color:var(--dim);
}
.style.on .tag{background:var(--accent);color:#fff}

/* 参数 */
.row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.row:last-child{margin-bottom:0}
.row label{width:104px;font-size:13px;color:var(--dim);flex-shrink:0}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.row .val{width:52px;text-align:right;font-size:12px;color:var(--accent2);font-variant-numeric:tabular-nums}

/* 按钮 */
.btn{
  width:100%;padding:13px;border:none;border-radius:9px;
  background:var(--accent);color:#fff;font-size:14px;font-weight:600;
  cursor:pointer;transition:.15s;
}
.btn:hover:not(:disabled){background:var(--accent2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover:not(:disabled){border-color:var(--accent)}

/* 状态 */
#status{
  margin-top:14px;padding:12px;border-radius:8px;
  background:var(--panel2);font-size:13px;color:var(--dim);
  display:none;font-family:ui-monospace,Consolas,monospace;
}
#status.show{display:block}
#status.err{background:#2a1a1a;color:#f87171}

/* 结果 */
#result{display:none}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.player{background:var(--panel2);border-radius:9px;padding:12px}
.player .t{font-size:12px;color:var(--dim);margin-bottom:8px}
.player audio{width:100%;height:34px}
@media(max-width:640px){.players{grid-template-columns:1fr}}

footer{margin-top:24px;font-size:12px;color:var(--dim);text-align:center;line-height:1.8}
code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Style<span>Shift</span></h1>
  <div class="sub">上传音频，选择目标风格，一键转换</div>
</header>

<!-- 1. 上传 -->
<div class="card">
  <h2>01 / 输入</h2>
  <div id="drop">
    <div class="big" id="dropText">拖入音频文件，或点击选择</div>
    <div class="small" id="dropSub">支持 mp3 / wav / flac / m4a</div>
    <div id="fileInfo">
      <div class="name" id="fName"></div>
      <div class="small" id="fMeta"></div>
    </div>
  </div>
  <div id="waveWrap">
    <canvas id="wave"></canvas>
    <div id="marks"></div>
  </div>
  <div class="mkTip" id="mkTip" style="display:none">
    在波形上点击添加段落标记，工具会在标记处插入怪叫
  </div>
  <div id="markList"></div>
  <input type="file" id="fileInput" accept="audio/*" hidden>
</div>

<!-- 2. 风格 -->
<div class="card">
  <h2>02 / 目标风格</h2>
  <div class="grid" id="styles"></div>
</div>

<!-- 3. 执行 -->
<div class="card">
  <h2>03 / 转换</h2>
  <button class="btn" id="runBtn" disabled>开始转换</button>
  <div id="status"></div>
</div>

<!-- 4. 结果 -->
<div class="card" id="result">
  <h2>04 / 结果</h2>
  <div class="players">
    <div class="player">
      <div class="t">原始</div>
      <audio id="audioOrig" controls></audio>
    </div>
    <div class="player">
      <div class="t">转换后</div>
      <audio id="audioOut" controls></audio>
    </div>
  </div>
  <button class="btn ghost" id="dlBtn">下载结果</button>
</div>

<footer>
  后端接口：<code>POST /api/convert</code> · 返回 <code>{ task_id }</code>，轮询 <code>GET /api/task/:id</code>
</footer>

</div>

<script>
// ===== 风格定义（参数来自实测数据）=====
const STYLES = [
  { id:'classical', name:'古典', desc:'弦乐四重奏 · 定音鼓点缀', tag:'A',
    preset:{ speed:60, sub:-2, hi:-2, reverb:55 } },
  { id:'tongtou', name:'通透', desc:'低频轰炸 · 高频砍掉', tag:'B',
    preset:{ speed:100, sub:9, hi:-18, reverb:15 } },
  { id:'arcade', name:'8-bit', desc:'街机音源 · 方波量化', tag:'C',
    preset:{ speed:110, sub:-4, hi:8, reverb:2 } },
];

let currentFile = null;
let currentStyle = null;
let audioBuffer = null;
let origURL = null;

// ===== 渲染风格卡 =====
const stylesEl = document.getElementById('styles');
STYLES.forEach(s => {
  const div = document.createElement('div');
  div.className = 'style';
  div.dataset.id = s.id;
  div.innerHTML = `<span class="tag">${s.tag}</span>
    <div class="n">${s.name}</div>
    <div class="d">${s.desc}</div>`;
  div.onclick = () => selectStyle(s);
  stylesEl.appendChild(div);
});

// ===== 参数控件 =====
// 参数由风格预设决定，无需手动调节
const P = () => currentStyle ? currentStyle.preset : { speed:100, sub:0, hi:0, reverb:20 };

// 处理逻辑内置于风格，无需开关

function selectStyle(s) {
  currentStyle = s;
  document.querySelectorAll('.style').forEach(el =>
    el.classList.toggle('on', el.dataset.id === s.id));
  updateBtn();
}

// ===== 上传 =====
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const waveCanvas = document.getElementById('wave');

drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
};
fileInput.onchange = () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); };

async function handleFile(file) {
  currentFile = file;
  if (origURL) URL.revokeObjectURL(origURL);
  origURL = URL.createObjectURL(file);

  drop.classList.add('has-file');
  document.getElementById('dropText').style.display = 'none';
  document.getElementById('dropSub').style.display = 'none';
  const fi = document.getElementById('fileInfo');
  fi.style.display = 'block';
  document.getElementById('fName').textContent = file.name;
  document.getElementById('fMeta').textContent =
    (file.size/1024/1024).toFixed(1) + ' MB · ' + (file.type || 'unknown');

  // 解码 + 画波形
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = await ctx.decodeAudioData(await file.arrayBuffer());
    audioBuffer = buf;
    drawWave(buf);
    document.getElementById('fMeta').textContent +=
      ` · ${buf.duration.toFixed(1)}s · ${buf.sampleRate}Hz`;
  } catch(e) {
    console.warn('解码失败', e);
  }
  updateBtn();
}

function drawWave(buf) {
  const c = waveCanvas, dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr;
  c.height = 80 * dpr;
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  c.style.display = 'block';

  const data = buf.getChannelData(0);
  const w = c.clientWidth, h = 80;
  const step = Math.ceil(data.length / w);
  const mid = h / 2;

  ctx.fillStyle = '#0a0a0e';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#7c6cf0';

  for (let x = 0; x < w; x++) {
    let min = 1, max = -1;
    for (let j = 0; j < step; j++) {
      const v = data[x * step + j] || 0;
      if (v < min) min = v;
      if (v > max) max = v;
    }
    const y1 = mid - max * mid * 0.9;
    const y2 = mid - min * mid * 0.9;
    ctx.fillRect(x, y1, 1, Math.max(1, y2 - y1));
  }
}

// ===== 转换 =====
const runBtn = document.getElementById('runBtn');
const statusEl = document.getElementById('status');

function updateBtn() {
  runBtn.disabled = !(currentFile && currentStyle);
}

function setStatus(msg, err) {
  statusEl.textContent = msg;
  statusEl.className = 'show' + (err ? ' err' : '');
}

runBtn.onclick = async () => {
  if (!currentFile || !currentStyle) return;
  runBtn.disabled = true;
  setStatus('正在上传…');

  const fd = new FormData();
  fd.append('audio', currentFile);
  fd.append('style', currentStyle.id);
  const p = P();
  fd.append('speed', p.speed);
  fd.append('sub', p.sub);
  fd.append('hi', p.hi);
  fd.append('reverb', p.reverb);

  try {
    const r = await fetch('/api/convert', { method:'POST', body: fd });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const { task_id } = await r.json();

    setStatus('转换中… 任务 ' + task_id);
    await pollTask(task_id);
  } catch (e) {
    // 后端未启动时，用前端模拟演示
    setStatus('后端未连接，使用本地模拟：' + e.message, true);
    await simulate();
  } finally {
    runBtn.disabled = false;
  }
};

async function pollTask(id) {
  for (let i = 0; i < 600; i++) {
    await new Promise(r => setTimeout(r, 1000));
    const r = await fetch('/api/task/' + id);
    const d = await r.json();
    if (d.status === 'done') {
      showResult(d.output_url);
      setStatus('完成');
      return;
    }
    if (d.status === 'error') throw new Error(d.error);
    setStatus(`转换中… ${d.progress || 0}%`);
  }
  throw new Error('超时');
}

// ===== 段落标注 =====
let marks = [];   // {time:秒, label:类型}
const MARK_TYPES = ['前奏','主歌','副歌','桥段','间奏','尾声','怪叫'];

waveCanvas.onclick = (e) => {
  if (!audioBuffer) return;
  const rect = waveCanvas.getBoundingClientRect();
  const t = ((e.clientX - rect.left) / rect.width) * audioBuffer.duration;
  marks.push({ time: t, label: '怪叫' });
  marks.sort((a,b) => a.time - b.time);
  renderMarks();
};

function renderMarks() {
  const box = document.getElementById('marks');
  const list = document.getElementById('markList');
  const tip = document.getElementById('mkTip');
  box.innerHTML = '';
  list.innerHTML = '';

  document.getElementById('mkTip').style.display = marks.length ? 'none' : 'block';

  if (!marks.length || !audioBuffer) {
    list.style.display = 'none';
    return;
  }
  list.style.display = 'flex';

  marks.forEach((m, idx) => {
    const pct = (m.time / audioBuffer.duration) * 100;
    const el = document.createElement('div');
    el.className = 'mk';
    el.style.left = pct + '%';
    el.dataset.label = m.label;
    el.onclick = (ev) => { ev.stopPropagation(); delMark(idx); };
    box.appendChild(el);

    const item = document.createElement('div');
    item.className = 'mkItem';
    const sel = document.createElement('select');
    MARK_TYPES.forEach(tp => {
      const o = document.createElement('option');
      o.value = tp; o.textContent = tp;
      if (tp === m.label) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { marks[idx].label = sel.value; renderMarks(); };

    const tm = document.createElement('span');
    tm.textContent = m.time.toFixed(1) + 's';
    tm.style.color = 'var(--dim)';

    const del = document.createElement('span');
    del.className = 'del'; del.textContent = '×';
    del.onclick = () => delMark(idx);

    item.append(sel, tm, del);
    list.appendChild(item);
  });
}

function delMark(i) {
  marks.splice(i, 1);
  renderMarks();
}

// 在标记处插入怪叫（噪声爆发 + 音高滑移）
function insertYells(buf) {
  const sr = buf.sampleRate;
  const out = new AudioBuffer({ length: buf.length, sampleRate: sr, numberOfChannels: 1 });
  const src = buf.getChannelData(0);
  const dst = out.getChannelData(0);
  dst.set(src);

  const targets = marks.filter(m => m.label === '怪叫');
  targets.forEach(m => {
    const s = Math.floor(m.time * sr);
    const n = Math.floor(sr * 0.35);          // 350ms
    const f0 = 220 + Math.random() * 300;     // 随机起始频率
    const sweep = (Math.random() - 0.5) * 2;  // 上滑或下滑
    for (let i = 0; i < n && s + i < dst.length; i++) {
      const t = i / sr;
      const env = Math.min(1, i / (sr * 0.02)) * Math.pow(1 - i / n, 2);
      const f = f0 * (1 + sweep * t * 3);
      // 锯齿波 + 噪声（人声吼叫的粗糙感）
      const saw = ((f * t) % 1) * 2 - 1;
      const noise = (Math.random() * 2 - 1) * 0.4;
      dst[s + i] += (saw * 0.6 + noise) * env * 0.45;
    }
  });

  // 削波保护
  let peak = 0;
  for (let i = 0; i < dst.length; i++) peak = Math.max(peak, Math.abs(dst[i]));
  if (peak > 1) for (let i = 0; i < dst.length; i++) dst[i] /= peak;
  return out;
}

// 本地模拟：用 Web Audio 做基础处理，演示界面流程
async function simulate() {
  if (!audioBuffer) { setStatus('无法解码音频', true); return; }
  setStatus('本地处理中（模拟后端）…');
  await new Promise(r => setTimeout(r, 600));

  const sr = audioBuffer.sampleRate;
  const p = P();
  const speed = p.speed / 100;

  const outLen = Math.floor(audioBuffer.length / speed);
  const off = new OfflineAudioContext(1, outLen, sr);
  const src = off.createBufferSource();
  src.buffer = audioBuffer;
  src.playbackRate.value = speed;

  // 双段 EQ
  const lowShelf = off.createBiquadFilter();
  lowShelf.type = 'lowshelf'; lowShelf.frequency.value = 150; lowShelf.gain.value = p.sub;
  const highShelf = off.createBiquadFilter();
  highShelf.type = 'highshelf'; highShelf.frequency.value = 3000; highShelf.gain.value = p.hi;

  src.connect(lowShelf).connect(highShelf).connect(off.destination);
  src.start();

  let rendered = await off.startRendering();

  // 8-bit：位深量化 + 降采样
  if (currentStyle?.id === 'arcade') {
    rendered = bitcrush(rendered, 4, 4);
  }

  // 鼓点重写（所有风格都做，各用各的音色）
  setStatus('分析鼓点…');
  const hits = detectOnsets(rendered);
  setStatus(`检测到 ${hits.length} 个鼓点，正在按 ${currentStyle?.name} 重写…`);
  rendered = rewriteDrums(rendered, hits, currentStyle?.id);

  // 通透：额外插入怪叫
  if (currentStyle?.id === 'tongtou') {
    const n = marks.filter(m => m.label === '怪叫').length;
    if (n > 0) {
      setStatus(`在 ${n} 处插入怪叫…`);
      rendered = insertYells(rendered);
    }
  }

  const url = bufferToWavURL(rendered);
  showResult(url);
  setStatus('完成（本地模拟，后端未接入）');
}

// 简易 onset 检测：能量包络的局部极大值
function detectOnsets(buf) {
  const d = buf.getChannelData(0);
  const sr = buf.sampleRate;
  const win = Math.floor(sr * 0.01);          // 10ms 窗
  const env = [];
  for (let i = 0; i + win < d.length; i += win) {
    let e = 0;
    for (let j = 0; j < win; j++) e += d[i+j] * d[i+j];
    env.push(Math.sqrt(e / win));
  }
  // 局部极大 + 阈值
  const hits = [];
  const mean = env.reduce((a,b)=>a+b,0) / env.length;
  for (let i = 2; i < env.length - 2; i++) {
    if (env[i] > env[i-1] && env[i] > env[i+1] && env[i] > mean * 1.6) {
      // 与前一个间隔至少 80ms
      if (!hits.length || (i - hits[hits.length-1]) * win / sr > 0.08) {
        hits.push(i);
      }
    }
  }
  return hits.map(i => i * win / sr);   // 转成秒
}

// 按目标风格重写鼓
function rewriteDrums(buf, hitTimes, styleId) {
  const sr = buf.sampleRate;
  const src = buf.getChannelData(0);
  const out = new AudioBuffer({ length: buf.length, sampleRate: sr, numberOfChannels: 1 });
  const dst = out.getChannelData(0);

  // 原鼓衰减：保留 40%（避免完全静音）
  for (let i = 0; i < src.length; i++) dst[i] = src[i] * 0.4;

  for (const t of hitTimes) {
    const s = Math.floor(t * sr);
    if (styleId === 'arcade') {
      // 噪声脉冲，40ms
      const n = Math.floor(sr * 0.04);
      for (let i = 0; i < n && s+i < dst.length; i++) {
        const env = Math.pow(1 - i/n, 3);
        dst[s+i] += (Math.random()*2-1) * env * 0.5;
      }
      // 低八度方波当底鼓
      const f = 55, n2 = Math.floor(sr * 0.06);
      for (let i = 0; i < n2 && s+i < dst.length; i++) {
        const env = Math.pow(1 - i/n2, 2);
        const ph = (f * i / sr) % 1;
        dst[s+i] += (ph < 0.5 ? 1 : -1) * env * 0.25;
      }
    } else if (styleId === 'tongtou') {
      // 低频正弦脉冲，每拍均等
      const f = 48, n = Math.floor(sr * 0.12);
      for (let i = 0; i < n && s+i < dst.length; i++) {
        const env = Math.pow(1 - i/n, 2);
        dst[s+i] += Math.sin(2*Math.PI*f*i/sr) * env * 0.7;
      }
    } else if (styleId === 'classical') {
      // 定音鼓：正弦 + 泛音，只打强拍（每 4 个检测点打 1 个）
      if (Math.round(t * 4) % 4 !== 0) continue;
      const f0 = 73, n = Math.floor(sr * 0.28);
      for (let i = 0; i < n && s+i < dst.length; i++) {
        const env = Math.pow(1 - i/n, 2.2);
        const v = Math.sin(2*Math.PI*f0*i/sr) * 0.8
                + Math.sin(2*Math.PI*f0*1.5*i/sr) * 0.3;   // 五度泛音
        dst[s+i] += v * env * 0.55;
      }
    }
  }

  // 削波保护
  let peak = 0;
  for (let i = 0; i < dst.length; i++) peak = Math.max(peak, Math.abs(dst[i]));
  if (peak > 1) for (let i = 0; i < dst.length; i++) dst[i] /= peak;

  return out;
}

// 位深量化 + 降采样（模拟 8-bit 音源）
function bitcrush(buf, bits, downsample) {
  const sr = buf.sampleRate;
  const out = new AudioBuffer({ length: buf.length, sampleRate: sr, numberOfChannels: 1 });
  const src = buf.getChannelData(0);
  const dst = out.getChannelData(0);
  const levels = Math.pow(2, bits);      // 4 bit = 16 级

  for (let i = 0; i < src.length; i++) {
    // 降采样：保持前一个样本
    const held = src[Math.floor(i / downsample) * downsample] ?? 0;
    // 量化
    dst[i] = Math.round(held * levels) / levels;
  }
  return out;
}

function bufferToWavURL(buf) {
  const ch = buf.getChannelData(0);
  const sr = buf.sampleRate;
  const len = ch.length;
  const ab = new ArrayBuffer(44 + len * 2);
  const v = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o+i, s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4, 36+len*2, true); ws(8,'WAVE');
  ws(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true);
  v.setUint16(22,1,true); v.setUint32(24,sr,true); v.setUint32(28,sr*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true);
  ws(36,'data'); v.setUint32(40,len*2,true);
  for (let i = 0; i < len; i++) {
    const s = Math.max(-1, Math.min(1, ch[i]));
    v.setInt16(44+i*2, s < 0 ? s*0x8000 : s*0x7fff, true);
  }
  return URL.createObjectURL(new Blob([ab], {type:'audio/wav'}));
}

// ===== 结果 =====
let outURL = null;
function showResult(url) {
  outURL = url;
  document.getElementById('result').style.display = 'block';
  document.getElementById('audioOrig').src = origURL;
  document.getElementById('audioOut').src = url;
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}

document.getElementById('dlBtn').onclick = () => {
  if (!outURL) return;
  const a = document.createElement('a');
  a.href = outURL;
  a.download = (currentFile?.name.replace(/\.[^.]+$/,'') || 'out') +
               '_' + (currentStyle?.id || 'styled') + '.wav';
  a.click();
};
